name: CI/CD Frontend Phoenix Orders

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/random0maat/jamac-frontend

jobs:
  # ==========================================
  # 1: AUDITORÍA DE SEGURIDAD (ESTÁTICA)
  # ==========================================
  security-audit:
    name: DevSecOps - Linter & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      # 1. Hadolint: Linter para el Dockerfile Nginx/Vue
      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # 2. Trivy Secrets: Escaneo de secretos/tokens en el código fuente
      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          exit-code: '1'

  # ==========================================
  # 2: VERIFICACIÓN Y COMPILACIÓN NODE.JS
  # ==========================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Frontend (verificación de build)
        run: npm run build

  # ==========================================
  # 3: CONSTRUCCIÓN, ESCANEO Y PUSH DOCKER
  # ==========================================      
  build-and-push-image:
    name: Build y Push de Imagen Docker
    needs: [security-audit, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compilar la imagen localmente para auditoría previa al Push
      - name: Build local de la imagen para análisis
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha

      # 3. Trivy Image: Vulnerabilidades en la imagen Nginx/Alpine
      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:temp-scan'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 4. Syft: Generación del SBOM (Inventario de paquetes)
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:temp-scan'
          format: 'spdx-json'
          output-file: 'sbom-frontend.json'

      - name: Subir SBOM como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend-manifest
          path: sbom-frontend.json    

      # Publicar la imagen limpia en GHCR    
      - name: Build y Push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 4: APROVISIONAMIENTO DE INFRAESTRUCTURA (IaC)
  # ==========================================
  provision-infra:
    name: Provisionar Servidor (Terraform)
    needs: [security-audit, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    outputs:
      public_ip: ${{ steps.tf-output.outputs.public_ip }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=frontend/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Exportar IP publica
        id: tf-output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy a DEV (EC2)
    needs: [build-and-push-image, provision-infra]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Esperar a que el servidor este listo (SSH)
        run: |
          echo "Esperando que ${{ needs.provision-infra.outputs.public_ip }} responda en el puerto 22..."
          for i in $(seq 1 20); do
            if nc -z -w3 ${{ needs.provision-infra.outputs.public_ip }} 22; then
              echo "SSH listo."
              break
            fi
            echo "Intento $i/20, esperando 10s..."
            sleep 10
          done

      - name: Desplegar imagen Docker en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision-infra.outputs.public_ip }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
              echo "Docker instalado correctamente."
            else
              echo "Docker ya está instalado, continuando..."
            fi

            echo "Descargando la nueva imagen desde el registry..."
            sudo docker pull ${{ env.IMAGE_NAME }}:latest

            echo "Deteniendo el contenedor anterior (si existe)..."
            sudo docker stop jamac-frontend || true
            sudo docker rm jamac-frontend || true

            echo "Levantando el contenedor nuevo..."
            sudo docker run -d \
              --name jamac-frontend \
              -p 80:80 \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:latest

            echo "Limpiando imágenes viejas sin usar..."
            sudo docker image prune -f

            echo "✅ Despliegue con Docker completado exitosamente"