name: CI/CD Frontend Phoenix Orders

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/random0maat/jamac-frontend

jobs:
  # ==========================================
  # 1: AUDITORÍA DE SEGURIDAD (ESTÁTICA)
  # ==========================================
  security-audit:
    name: DevSecOps - Linter & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      # 1. Hadolint: Linter para el Dockerfile Nginx/Vue
      - name: Run Hadolint (Dockerfile Linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # 2. Trivy Secrets: Escaneo de secretos/tokens en el código fuente
      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          exit-code: '1'

  # ==========================================
  # 2: VERIFICACIÓN Y COMPILACIÓN NODE.JS
  # ==========================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Frontend (verificación de build)
        run: npm run build

  # ==========================================
  # 3: CONSTRUCCIÓN, ESCANEO Y PUSH DOCKER
  # ==========================================      
  build-and-push-image:
    name: Build y Push de Imagen Docker
    needs: [security-audit, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compilar la imagen localmente para auditoría previa al Push
      - name: Build local de la imagen para análisis
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:temp-scan
          cache-from: type=gha

      # 3. Trivy Image: Vulnerabilidades en la imagen Nginx/Alpine
      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:temp-scan'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 4. Syft: Generación del SBOM (Inventario de paquetes)
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:temp-scan'
          format: 'spdx-json'
          output-file: 'sbom-frontend.json'

      - name: Subir SBOM como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend-manifest
          path: sbom-frontend.json    

      # Publicar la imagen limpia en GHCR    
      - name: Build y Push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy a DEV (EC2)
    needs: [build-and-push-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar carpeta kubernetes al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "kubernetes/"
          target: "/home/${{ secrets.SERVER_USER }}/"

      - name: Desplegar en Kubernetes (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Aplicando manifiestos de Kubernetes..."
            kubectl apply -f kubernetes/frontend-deployment.yaml
            kubectl apply -f kubernetes/frontend-service.yaml

            echo "Reiniciando el despliegue del frontend para forzar descarga de la última imagen..."
            kubectl rollout restart deployment/jamac-frontend

            echo "Esperando a que el despliegue esté listo..."
            kubectl rollout status deployment/jamac-frontend --timeout=180s

            echo "✅ Despliegue de Frontend con Kubernetes completado exitosamente"